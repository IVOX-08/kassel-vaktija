# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Silence the "selected Xcode version is higher than the maximum known to the Kotlin Gradle Plugin"
# warning. Xcode 16.4 builds the iOS framework fine; this just removes the noise.
kotlin.apple.xcodeCompatibility.nowarn=true

# Non-transitive R classes (smaller, faster builds)
android.nonTransitiveRClass=true
