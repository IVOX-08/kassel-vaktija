# XcodeGen spec — generates iosApp.xcodeproj from this file (run `xcodegen generate`).
# Lets us version-control the iOS project as plain text instead of a fragile .pbxproj.
name: iosApp
options:
  bundleIdPrefix: de.igbdsandzakkassel.vaktija
  # iOS 17, wegen der Ja/Nein-Knoepfe im Widget: Knoepfe in einem Widget gibt es erst ab
  # iOS 17 (AppIntents), vorher konnte ein Widget nur anzeigen. Der Preis sind iPhone 8,
  # 8 Plus und X — ab iPhone XS/XR laeuft alles weiter.
  deploymentTarget:
    iOS: "17.0"
# Same Firebase project as Android (`kassel-vaktija`) — see docs/ios/FIREBASE-HANDOFF.md.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    minVersion: "11.0.0"
    maxVersion: "12.0.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # Code, den App UND Widget brauchen (App-Gruppe, Sprache, Gemeindewahl). Liegt bewusst
      # ausserhalb von iosApp/, damit klar ist, dass er zu beiden gehoert.
      - path: SharedCode
      - path: Resources/hadith
        type: folder
      - path: Resources/quran
        type: folder
      - path: Resources/flags
        type: folder
      # NOT a folder reference: UNNotificationSound only finds tones at the bundle root
      # (or in Library/Sounds) — from a subfolder iOS silently falls back to the default
      # tone, so the 19-second Adhan would never be heard.
      - path: Resources/audio
      - path: Resources/lang
        type: folder
      # Verzeichnis der Gemeinden. Flach eingebunden, damit Bundle.main.url es ohne
      # Unterordner findet; beim Start wird aus Firestore nachgeladen.
      - path: Resources/communities
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: IGBD Vaktija
        UILaunchScreen: {}
        # Die App spricht nur über HTTPS, nutzt also ausschließlich die
        # Standardverschlüsselung des Systems. Mit diesem Eintrag entfällt die
        # Ausfuhrkontroll-Frage bei jedem Upload.
        ITSAppUsesNonExemptEncryption: false
        # Pflichtangabe für den App-Store-Upload ("No orientations were specified").
        #
        # Die App ist durchgehend im Hochformat gestaltet — bis auf den Koran-Leser. Quer gehalten
        # passen deutlich mehr Wörter in eine Zeile, und lange Ajahs zerfallen nicht in Schnipsel.
        # Damit sich nicht die ganze App mitdreht, erlaubt der AppDelegate das Querformat nur,
        # solange der Leser offen ist (siehe PushService.swift).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Inter.ttf
          # Amiri Quran (SIL OFL) — die osmanische/tuerkische Schrift im Koran-Leser.
          - AmiriQuran.ttf
        # Apple prueft Zweck-Texte streng (Richtlinie 5.1.1): Er muss sagen WOFUER und ein
        # Beispiel geben. Der alte Satz nannte nur „die Kompassrichtung".
        NSLocationWhenInUseUsageDescription: "Nur für den Qibla-Kompass: Aus deinem Standort wird die Richtung zur Kaaba berechnet — in Kassel etwa 130 Grad. Der Standort bleibt auf dem Gerät und wird nicht gespeichert oder weitergegeben. Ohne Freigabe zeigt die App die Richtung ab der Adresse deiner Moschee."
        # Silent push for prayer-time changes (onConfigUpdated sends content-available).
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.igbdsandzakkassel.vaktija.ios
        GENERATE_INFOPLIST_FILE: "YES"
        # 1 = nur iPhone. Ohne das gilt die App als iPad-fähig und Apple verlangt
        # iPad-Multitasking mit allen vier Ausrichtungen — dafür ist sie nicht gebaut.
        TARGETED_DEVICE_FAMILY: "1"
        # App icon: the community crest on white (Apple rejects transparency in app icons).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Push (Firebase Messaging) braucht das aps-environment-Entitlement.
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Ausdruecklich Swift 5. Ohne die Zeile entscheidet die gerade installierte Xcode-Fassung,
        # und der Wechsel auf Swift 6 bringt strenge Nebenlaeufigkeitspruefungen mit, an denen der
        # Cloud-Build ohne Vorwarnung scheitern wuerde -- auf einem Rechner, an dem niemand sitzt.
        SWIFT_VERSION: "5.0"
        # IGBD - Gemeinde Sandzak-Kassel e.V. (Company-Account).
        DEVELOPMENT_TEAM: RM3FWBH4T7
        # Allow the Gradle build-script phase below to run (Xcode 15+ sandboxing would block it).
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Where Kotlin's embedAndSignAppleFrameworkForXcode places the built "Shared" framework.
        # (Path confirmed/adjusted on the first real build once Xcode is installed.)
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
      configs:
        # Ad-hoc signing so the Simulator build can use the keychain — without it Firebase Auth
        # fails with error 17995 ("An error occurred when accessing the keychain") and no admin can
        # sign in. Nur Debug — Release muss echt signiert werden, sonst lehnt Apple den Upload ab.
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "YES"
        Release:
          # Keine CODE_SIGN_IDENTITY setzen: bei Automatic wählt Xcode sie selbst
          # (Development zum Bauen, Distribution beim Archivieren). Eine feste Angabe
          # führt zu "conflicting provisioning settings".
          CODE_SIGN_STYLE: Automatic
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGNING_ALLOWED: "YES"
    # Embed the home-screen widget extension in the app.
    dependencies:
      - target: iosWidget
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
    # Build (and embed) the Kotlin shared framework before compiling the Swift app.
    preBuildScripts:
      - name: Build Kotlin Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  # Home-screen widget (spec 7) — a WidgetKit extension that reuses the shared Kotlin next-prayer logic.
  iosWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: iosWidget
      - path: SharedCode
      # Die Texte. Das Widget stand bisher fest auf Deutsch, waehrend die App acht Sprachen kann.
      - path: Resources/lang
        type: folder
    info:
      path: iosWidget/Info.plist
      properties:
        CFBundleDisplayName: IGBD Vaktija
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.igbdsandzakkassel.vaktija.ios.widget
        GENERATE_INFOPLIST_FILE: "NO"
        # Gemeinsamer Speicher mit der App — siehe SharedCode/SharedDefaults.swift.
        CODE_SIGN_ENTITLEMENTS: iosWidget/iosWidget.entitlements
        # Muss zur App passen, sonst lehnt die Validierung das Paket ab.
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Muss zur App passen, sonst weist App Store Connect das Paket zurück.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Ausdruecklich Swift 5. Ohne die Zeile entscheidet die gerade installierte Xcode-Fassung,
        # und der Wechsel auf Swift 6 bringt strenge Nebenlaeufigkeitspruefungen mit, an denen der
        # Cloud-Build ohne Vorwarnung scheitern wuerde -- auf einem Rechner, an dem niemand sitzt.
        SWIFT_VERSION: "5.0"
        # IGBD - Gemeinde Sandzak-Kassel e.V. (Company-Account).
        DEVELOPMENT_TEAM: RM3FWBH4T7
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../../Frameworks"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "YES"
        Release:
          # Keine CODE_SIGN_IDENTITY setzen: bei Automatic wählt Xcode sie selbst
          # (Development zum Bauen, Distribution beim Archivieren). Eine feste Angabe
          # führt zu "conflicting provisioning settings".
          CODE_SIGN_STYLE: Automatic
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGNING_ALLOWED: "YES"
    # The widget links the shared framework too, so make sure it's built first.
    preBuildScripts:
      - name: Build Kotlin Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
